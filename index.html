    const AuthContext = createContext();
    const LOCAL_USERS_KEY = 'tina_users_data';
    const CURRENT_USER_KEY = 'tina_current_user';
    const INITIAL_USERS = [
      { id: 'usr-admin-1', email: 'admin@regaleriatina.com', password: 'admin123', full_name: 'Administrador Principal', role: 'admin' },

    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [usersList, setUsersList] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        try {
          const stored = localStorage.getItem(LOCAL_USERS_KEY);
          const users = stored ? JSON.parse(stored) : INITIAL_USERS;
          setUsersList(users);
          const saved = localStorage.getItem(CURRENT_USER_KEY);
          setUser(saved ? JSON.parse(saved) : null);
        } catch {
          setUsersList(INITIAL_USERS);
          setUser(null);
        }
        setLoading(false);
      }, []);

      const login = (email, password) => {
        const found = usersList.find(u => u.email.toLowerCase() === email.toLowerCase());
        if (!found) throw new Error('El correo electrónico no se encuentra registrado.');
        if (found.password && password && found.password !== password) throw new Error('La contraseña ingresada es incorrecta.');
        setUser(found);
        localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(found));
        return found;
      };

      const register = (email, password, fullName) => {
        const existing = usersList.find(u => u.email.toLowerCase() === email.toLowerCase());
        if (existing) throw new Error('El correo electrónico ya está registrado.');
        const newUser = { id: 'usr-' + Date.now(), email: email.trim(), password: password.trim(), full_name: fullName.trim(), role: 'cajero' };
        const updated = [...usersList, newUser];
        setUsersList(updated);
        localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(updated));
        setUser(newUser);
        localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(newUser));
        return newUser;
      };

      const resetPassword = (email, newPassword) => {
        const found = usersList.find(u => u.email.toLowerCase() === email.toLowerCase());
        if (!found) throw new Error('No se encontró ningún usuario con ese correo electrónico.');
        const updated = usersList.map(u => u.id === found.id ? { ...u, password: newPassword.trim() } : u);
        setUsersList(updated);
        localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(updated));
        return true;
      };

      const logout = () => { setUser(null); localStorage.removeItem(CURRENT_USER_KEY); };
      const updateUserRole = (userId, newRole) => {
        const updated = usersList.map(u => u.id === userId ? { ...u, role: newRole } : u);
        setUsersList(updated); localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(updated));
        if (user?.id === userId) { const uUser = { ...user, role: newRole }; setUser(uUser); localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(uUser)); }
      };
      const updateUser = (userId, data) => {
        const updated = usersList.map(u => u.id === userId ? { ...u, full_name: data.full_name, email: data.email, password: data.password || u.password, role: data.role } : u);
        setUsersList(updated); localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(updated));
        if (user?.id === userId) { const uSelf = updated.find(u => u.id === userId); setUser(uSelf); localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(uSelf)); }
      };
      const createNewUser = (email, password, fullName, role) => {
        const newUser = { id: 'usr-' + Date.now(), email: email.trim(), password: password || '123456', full_name: fullName.trim(), role: role || 'cajero' };
        const updated = [...usersList, newUser]; setUsersList(updated); localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(updated)); return newUser;
      };
      const deleteUser = (userId) => {
        if (user?.id === userId) throw new Error('No puedes eliminar tu propio usuario activo.');
        const updated = usersList.filter(u => u.id !== userId); setUsersList(updated); localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(updated));
      };

      return (
        <AuthContext.Provider value={{ user, usersList, loading, login, register, resetPassword, logout, updateUserRole, updateUser, createNewUser, deleteUser, isAdmin: user?.role === 'admin' }}>
          {children}
        </AuthContext.Provider>
      );
    }

    function getCategoryPrefix(category = '', productName = '') {
      let mainInitial = 'X';
      let subInitial = 'X';
      const fullText = (category + ' ' + productName).toLowerCase();
      const catLower = (category || '').toLowerCase();

      if (catLower.includes('marroquin')) mainInitial = 'M';
      else if (catLower.includes('bijou')) mainInitial = 'B';
      else if (catLower.includes('accesorios') || catLower.includes('pelo')) mainInitial = 'A';
      else if (catLower.includes('cosmétic') || catLower.includes('cosmet') || catLower.includes('skincare')) mainInitial = 'C';
      else if (catLower.includes('infantil') || catLower.includes('juguet')) mainInitial = 'I';
      else if (catLower.includes('bazar')) mainInitial = 'Z';
      else if (catLower.includes('tazas') || catLower.includes('vajilla')) mainInitial = 'V';
      else if (catLower.includes('tecnolog')) mainInitial = 'T';
      else if (catLower.includes('regaler')) mainInitial = 'R';
      else if (catLower.includes('lencer') || catLower.includes('ropa')) mainInitial = 'L';
      else {
        const cleanCat = category.replace(/[^a-zA-Z]/g, '');
        mainInitial = cleanCat.charAt(0).toUpperCase() || 'P';
      }

      if (fullText.includes('bandolera')) subInitial = 'B';
      else if (fullText.includes('riñonera')) subInitial = 'R';
      else if (fullText.includes('cartera')) subInitial = 'C';
      else if (fullText.includes('mochila')) subInitial = 'M';
      else if (fullText.includes('billetera')) subInitial = 'W';
      else if (fullText.includes('bolso')) subInitial = 'O';
      else if (fullText.includes('lunchera')) subInitial = 'L';
      else if (fullText.includes('cartuchera')) subInitial = 'T';
      else if (fullText.includes('cinto')) subInitial = 'K';
      else if (fullText.includes('cadena')) subInitial = 'C';
      else if (fullText.includes('rosario') || fullText.includes('denario')) subInitial = 'R';
      else if (fullText.includes('pulsera') || fullText.includes('brazalete')) subInitial = 'P';
      else if (fullText.includes('aro')) subInitial = 'A';
      else if (fullText.includes('dije') || fullText.includes('medalla')) subInitial = 'D';
      else if (fullText.includes('choker') || fullText.includes('gargantilla')) subInitial = 'K';
      else if (fullText.includes('anillo')) subInitial = 'N';
      else if (fullText.includes('conjunto')) subInitial = 'J';
      else if (fullText.includes('broche')) subInitial = 'B';
      else if (fullText.includes('colero') || fullText.includes('gomita') || fullText.includes('scrunchie')) subInitial = 'C';
      else if (fullText.includes('vincha') || fullText.includes('dona')) subInitial = 'V';
      else if (fullText.includes('peine') || fullText.includes('cepillo')) subInitial = 'P';
      else if (fullText.includes('rostro')) subInitial = 'R';
      else if (fullText.includes('ojo') || fullText.includes('ceja')) subInitial = 'O';
      else if (fullText.includes('labio')) subInitial = 'L';
      else if (fullText.includes('maquillaje')) subInitial = 'M';
      else if (fullText.includes('manicur') || fullText.includes('esmalte')) subInitial = 'N';
      else if (fullText.includes('termo')) subInitial = 'T';
      else if (fullText.includes('mate')) subInitial = 'M';
      else if (fullText.includes('botella') || fullText.includes('vaso')) subInitial = 'B';
      else if (fullText.includes('bombilla') || fullText.includes('yerbero')) subInitial = 'Y';
      else if (fullText.includes('jarra') || fullText.includes('chopp')) subInitial = 'J';
      else if (fullText.includes('espejo')) subInitial = 'E';
      else if (fullText.includes('asado')) subInitial = 'A';
      else {
        let subPart = category.includes('-') ? category.split('-')[1].trim() : productName || category;
        const cleanSub = subPart.replace(/[^a-zA-Z]/g, '');
        subInitial = cleanSub.charAt(0).toUpperCase() || 'G';
      }

      return `${mainInitial}${subInitial}`;
    }

    function generateAutoCode(category = '', products = [], productName = '', subcode = '01', excludeId = null) {
      const prefix = getCategoryPrefix(category, productName);
      const cleanSubcode = String(subcode || '01').trim().toUpperCase().padStart(2, '0');
      const regexWithSub = new RegExp(`^${prefix}-${cleanSubcode}-(\\d+)$`, 'i');
      const regexGeneric = new RegExp(`^${prefix}-(\\d+)$`, 'i');

      (products || []).forEach(p => {
        if (p.barcode && p.id !== excludeId) {
          const codeStr = String(p.barcode).trim();
          let match = codeStr.match(regexWithSub);
          if (match) {
            const num = parseInt(match[1], 10);
            if (!isNaN(num) && num > maxNum) maxNum = num;
          } else {
            match = codeStr.match(regexGeneric);
            if (match) {
              const num = parseInt(match[1], 10);
              if (!isNaN(num) && num > maxNum) maxNum = num;
            }
          }
        }
      });

      let nextSeq = maxNum + 1;
      let candidate = `${prefix}-${cleanSubcode}-${String(nextSeq).padStart(4, '0')}`;

      const existingCodes = new Set(
        (products || [])
          .filter(p => p.id !== excludeId && p.barcode)
          .map(p => String(p.barcode).trim().toUpperCase())
      );

      while (existingCodes.has(candidate.toUpperCase())) {
        nextSeq++;
        candidate = `${prefix}-${cleanSubcode}-${String(nextSeq).padStart(4, '0')}`;
      }

      return candidate;
    }

      const processSale = ({ items, paymentMethod, customerId, newCustomerData }) => {
        if (!cashSession || cashSession.status !== 'open') throw new Error('La caja diaria se encuentra CERRADA. Abra la caja para registrar ventas.');
        let activeCust = customers.find(c => c.id === customerId);
        if (!activeCust && newCustomerData) activeCust = addCustomer(newCustomerData);
        if (paymentMethod === 'Cuenta Corriente' && (!activeCust || activeCust.id === 'cust-ocasional')) throw new Error('Seleccione o registre un cliente válido con Nombre, DNI, Domicilio y Teléfono para Cta Cte.');

        const subtotal = items.reduce((acc, i) => acc + (i.sellPrice * i.quantity), 0);
        const interestAmount = paymentMethod === 'Cuenta Corriente' ? Math.round(subtotal * 0.10) : 0;
        const total = subtotal + interestAmount;
        const dueDate = new Date(); dueDate.setDate(dueDate.getDate() + 30);

        const newSale = {
          id: 'sale-' + Date.now(), customerId: activeCust ? activeCust.id : 'cust-ocasional', customerName: activeCust ? activeCust.name : 'Cliente Ocasional',
          userId: user?.id, userName: user?.full_name||'Cajero', paymentMethod, subtotal, interestAmount, total, dueDate: dueDate.toISOString(),
          status: 'completed', created_at: new Date().toISOString(),
          items: items.map(i => ({ productId: i.id, name: i.name, quantity: i.quantity, unitPrice: i.sellPrice, subtotal: i.sellPrice * i.quantity }))
        };

        saveProds(products.map(p => { const item = items.find(i => i.id === p.id); return item ? { ...p, stock: Math.max(0, p.stock - item.quantity) } : p; }));
        if (paymentMethod === 'Cuenta Corriente' && activeCust) {
          saveCusts(customers.map(c => c.id === activeCust.id ? { ...c, balance: (c.balance||0) + total } : c));
        }
        saveSales([newSale, ...sales]); return newSale;
      };

      const openCash = (openAmount) => {
        const sess = { id: 'cash-' + Date.now(), status: 'open', openAmount: parseFloat(openAmount)||0, openedAt: new Date().toISOString(), openedBy: user?.full_name||'Cajero' };
        setCashSession(sess); localStorage.setItem('tina_cash_session', JSON.stringify(sess));
      };

      const closeCash = (closeAmount, auditDetails = null) => {
        const sess = { ...(cashSession||{}), status: 'closed', closeAmount: parseFloat(closeAmount)||0, closedAt: new Date().toISOString(), closedBy: user?.full_name||'Cajero', audit: auditDetails };
        setCashSession(sess); localStorage.setItem('tina_cash_session', JSON.stringify(sess));
        const updatedH = [sess, ...cashHistory]; setCashHistory(updatedH); localStorage.setItem('tina_cash_history', JSON.stringify(updatedH));
      };

      const deleteCashHistoryRecord = (id) => {
        if (user?.role !== 'admin') throw new Error('Solo el Administrador puede eliminar registros del historial de caja.');
        const updated = cashHistory.filter(h => h.id !== id);
        setCashHistory(updated); localStorage.setItem('tina_cash_history', JSON.stringify(updated));
      };

      const exportBackupData = () => {
        const backupObj = { version: '2.5', exportDate: new Date().toISOString(), appName: 'Regalería Tina Gestor', products, customers, sales, payments, expenses, cashSession, cashHistory };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj, null, 2));
        const downloadAnchor = document.createElement('a');
        const dateStamp = new Date().toISOString().split('T')[0];
        downloadAnchor.setAttribute("href", dataStr); downloadAnchor.setAttribute("download", `regaleria_tina_backup_${dateStamp}.json`);
        document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove();
      };

      const importBackupData = (jsonData) => {
        try {
          const parsed = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
          if (!parsed || typeof parsed !== 'object') throw new Error('Formato no válido.');
          if (parsed.products) { setProducts(parsed.products); localStorage.setItem('tina_products', JSON.stringify(parsed.products)); }
          if (parsed.customers) { setCustomers(parsed.customers); localStorage.setItem('tina_customers', JSON.stringify(parsed.customers)); }
          if (parsed.sales) { setSales(parsed.sales); localStorage.setItem('tina_sales', JSON.stringify(parsed.sales)); }
          if (parsed.payments) { setPayments(parsed.payments); localStorage.setItem('tina_payments', JSON.stringify(parsed.payments)); }
          if (parsed.expenses) { setExpenses(parsed.expenses); localStorage.setItem('tina_expenses', JSON.stringify(parsed.expenses)); }
          if (parsed.cashSession) { setCashSession(parsed.cashSession); localStorage.setItem('tina_cash_session', JSON.stringify(parsed.cashSession)); }
          if (parsed.cashHistory) { setCashHistory(parsed.cashHistory); localStorage.setItem('tina_cash_history', JSON.stringify(parsed.cashHistory)); }
          return true;
        } catch (e) { throw new Error('Error al importar copia: ' + e.message); }
      };

      const lowStockProducts = useMemo(() => products.filter(p => p.stock <= p.minStock), [products]);
      const overdueCustomers = useMemo(() => {
        return customers.filter(c => {
          if (!c.balance || c.balance <= 0 || c.id === 'cust-ocasional') return false;
          const cSales = sales.filter(s => s.customerId === c.id && s.paymentMethod === 'Cuenta Corriente');
          if (cSales.length === 0) return c.created_at ? ((Date.now() - new Date(c.created_at).getTime()) / (1000*3600*24)) >= 30 : false;
          const oldest = cSales.reduce((min, s) => new Date(s.created_at) < min ? new Date(s.created_at) : min, new Date());
          return ((Date.now() - oldest.getTime()) / (1000*3600*24)) >= 30;
        });
      }, [customers, sales]);

      return (
        <DataContext.Provider value={{
          products, categories, addCategory, brands, addBrand, deleteBrand, addProduct, updateProduct, deleteProduct, adjustProductStock,
          customers, addCustomer, updateCustomer, deleteCustomer, addPayment,
          sales, payments, processSale, expenses, expenseCategories: EXPENSE_CATEGORIES, addExpense, deleteExpense,
          cashSession, cashHistory, openCash, closeCash, deleteCashHistoryRecord, exportBackupData, importBackupData, lowStockProducts, overdueCustomers
        }}>
          {children}
        </DataContext.Provider>
      );
    }
    const useData = () => useContext(DataContext);

    // --- SECTOR VENTAS (POS) COMPLETO ---
    function POS() {
      const { products, customers, addCustomer, updateCustomer, deleteCustomer, processSale, cashSession } = useData();

      const [search, setSearch] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [cart, setCart] = useState([]);
      const [paymentMethod, setPaymentMethod] = useState('Efectivo');
      const [selectedCustomerId, setSelectedCustomerId] = useState('');

      const [showNewCustModal, setShowNewCustModal] = useState(false);
      const [custName, setCustName] = useState('');
      const [custDni, setCustDni] = useState('');
      const [custAddress, setCustAddress] = useState('');
      const [custPhone, setCustPhone] = useState('');

      const [showEditCustModal, setShowEditCustModal] = useState(false);
      const [editForm, setEditForm] = useState({ name: '', dni: '', address: '', phone: '' });

      const [completedSale, setCompletedSale] = useState(null);
      const [errorMsg, setErrorMsg] = useState('');

      const selectedCustomerObj = useMemo(() => customers.find(c => c.id === selectedCustomerId), [customers, selectedCustomerId]);
      const filteredProducts = useMemo(() => {
        const term = search.trim().toLowerCase();
        if (!term) {
          return products.filter(p => selectedCategory === 'ALL' || p.category.startsWith(selectedCategory));
        }
        const cleanTerm = term.replace(/[^a-z0-9]/g, '');
        return products.filter(p => {
          const codeLower = (p.barcode || '').toLowerCase();
          const cleanCode = codeLower.replace(/[^a-z0-9]/g, '');

          const matchCode = codeLower.includes(term) || (cleanCode && cleanCode.includes(cleanTerm));
          const matchName = p.name.toLowerCase().includes(term);
          const matchCategory = p.category.toLowerCase().includes(term);
          const matchBrand = p.brand && p.brand.toLowerCase().includes(term);

          const matchSearch = matchCode || matchName || matchCategory || matchBrand;
          const matchCat = selectedCategory === 'ALL' || p.category.startsWith(selectedCategory);
          return matchSearch && matchCat;
        });
      }, [products, search, selectedCategory]);

      const handleSearchKeyDown = (e) => {
        if (e.key === 'Enter' && search.trim()) {
          const term = search.trim().toLowerCase();
          const cleanTerm = term.replace(/[^a-z0-9]/g, '');
          const exactMatch = products.find(p => {
            const codeLower = (p.barcode || '').toLowerCase();
            const cleanCode = codeLower.replace(/[^a-z0-9]/g, '');
            return codeLower === term || (cleanCode && cleanCode === cleanTerm);
          });
          if (exactMatch) {
            if (exactMatch.stock > 0) {
              addToCart(exactMatch);
              setSearch('');
              setErrorMsg('');
            } else {
              setErrorMsg(`El producto "${exactMatch.name}" (${exactMatch.barcode}) se encuentra AGOTADO.`);
            }
          }
        }
      };

      const addToCart = (product) => {
        if (product.stock <= 0) return;
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            if (existing.quantity >= product.stock) return prev;
            return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { ...product, quantity: 1 }];
        });
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.quantity + delta;
            if (newQty <= 0) return null;
            if (newQty > item.stock) return item;
            return { ...item, quantity: newQty };
          }
          return item;
        }).filter(Boolean));
      };

      const removeItemFromCart = (id) => setCart(prev => prev.filter(item => item.id !== id));
      const clearAllCart = () => setCart([]);

      const subtotal = useMemo(() => cart.reduce((acc, item) => acc + (item.sellPrice * item.quantity), 0), [cart]);
      const interestAmount = paymentMethod === 'Cuenta Corriente' ? Math.round(subtotal * 0.10) : 0;
      const total = subtotal + interestAmount;
      const formatPrice = (v) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(v);

      const handleQuickAddCustomer = (e) => {
        e.preventDefault();
        if (!custName.trim() || !custDni.trim() || !custAddress.trim() || !custPhone.trim()) {
          return setErrorMsg('Ingrese Nombre, DNI, Domicilio y Teléfono.');
        }
        const newCust = addCustomer({ name: custName, dni: custDni, address: custAddress, phone: custPhone });
        setSelectedCustomerId(newCust.id);
        setShowNewCustModal(false); setCustName(''); setCustDni(''); setCustAddress(''); setCustPhone(''); setErrorMsg('');
      };

      const openEditCustomerModal = () => {
        if (!selectedCustomerObj) return;
        setEditForm({ name: selectedCustomerObj.name, dni: selectedCustomerObj.dni||'', address: selectedCustomerObj.address||'', phone: selectedCustomerObj.phone||'' });
        setShowEditCustModal(true);
      };

      const handleSaveEditCustomer = (e) => {
        e.preventDefault();
        if (selectedCustomerObj && editForm.name.trim()) {
          updateCustomer(selectedCustomerObj.id, editForm);
          setShowEditCustModal(false);
        }
      };

      const handleDeleteSelectedCustomer = () => {
        if (selectedCustomerObj && window.confirm(`¿Eliminar al cliente "${selectedCustomerObj.name}"?`)) {
          deleteCustomer(selectedCustomerObj.id);
          setSelectedCustomerId('');
        }
      };

      const handleCheckout = () => {
        setErrorMsg('');
        if (!cashSession || cashSession.status !== 'open') {
          return setErrorMsg('La caja diaria se encuentra CERRADA. Abra la caja en la pestaña "Caja Diaria" para cobrar.');
        }
        if (cart.length === 0) return setErrorMsg('El carrito está vacío.');
        if (paymentMethod === 'Cuenta Corriente' && !selectedCustomerId) {
          return setErrorMsg('Debe seleccionar o registrar un cliente válido para cobrar en Cuenta Corriente.');
        }

        try {
          const saleResult = processSale({ items: cart, paymentMethod, customerId: selectedCustomerId });
          setCompletedSale(saleResult);
          clearAllCart();
          setSelectedCustomerId('');
        } catch (err) {
          setErrorMsg(err.message || 'Error al procesar la venta.');
        }
      };

      return (
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 420px', gap: '24px', maxWidth: '1400px', margin: '24px auto', padding: '0 20px' }}>
          <div>
            {cashSession?.status !== 'open' && (
              <div style={{ background: 'rgba(239, 68, 68, 0.15)', border: '1px solid rgba(239, 68, 68, 0.3)', color: '#f87171', padding: '12px 18px', borderRadius: '12px', marginBottom: '20px', display: 'flex', alignItems: 'center', gap: '12px' }}>
                <AlertTriangle size={20} />
                <div><strong>Caja Diaria Cerrada:</strong> Abra la caja desde la pestaña "Caja Diaria" para registrar ventas.</div>
              </div>
            )}

            <div className="glass-card" style={{ padding: '18px 24px', marginBottom: '20px' }}>
              <div style={{ display: 'flex', gap: '14px', marginBottom: '14px' }}>
                <div style={{ flex: 1, position: 'relative' }}>
                  <Search size={18} style={{ position: 'absolute', left: '14px', top: '50%', transform: 'translateY(-50%)', color: 'var(--text-dim)' }} />
                  <input 
                    type="text" 
                    className="form-control" 
                    style={{ paddingLeft: '42px', fontSize: '0.95rem', fontWeight: 600 }} 
                    placeholder="🔍 Buscar por Código (ej. MB-01-0001), Nombre, Marca o Categoría..." 
                    value={search} 
                    onChange={e => setSearch(e.target.value)} 
                    onKeyDown={handleSearchKeyDown}
                  />
                </div>
              </div>
              <div style={{ display: 'flex', gap: '8px', overflowX: 'auto', paddingBottom: '4px' }}>
                {['ALL', 'Bijouterie', 'Marroquinería', 'Regalería'].map(cat => (
                  <button key={cat} className={`btn btn-sm ${selectedCategory === cat ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setSelectedCategory(cat)}>
                    {cat === 'ALL' ? 'Todos los Productos' : cat}
                  </button>
                ))}
              </div>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: '16px' }}>
              {filteredProducts.map(p => {
                const isOutOfStock = p.stock <= 0;
                const isLowStock = p.stock <= p.minStock && !isOutOfStock;
                return (
                  <div key={p.id} className="glass-card" style={{ padding: '16px', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', opacity: isOutOfStock ? 0.6 : 1 }}>
                    <div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                        <span style={{ fontSize: '0.7rem', color: 'var(--color-primary)', fontWeight: 700 }}>{p.category.split(' - ')[1] || p.category}</span>
                        <span className={`badge ${isOutOfStock ? 'badge-danger' : isLowStock ? 'badge-warning' : 'badge-success'}`}>{isOutOfStock ? 'Agotado' : `Stock: ${p.stock}`}</span>
                      </div>
                      <div style={{ marginBottom: '6px', display: 'flex', gap: '6px', flexWrap: 'wrap', alignItems: 'center' }}>
                        <span style={{ fontSize: '0.75rem', fontWeight: 800, color: '#ec4899', background: 'rgba(236, 72, 153, 0.12)', padding: '2px 8px', borderRadius: '12px' }}>
                          🏷️ {p.brand || 'Sin Marca'}
                        </span>
                        <span style={{ 
                          fontSize: '0.75rem', 
                          fontWeight: 900, 
                          color: '#c4b5fd', 
                          background: 'rgba(139, 92, 246, 0.15)', 
                          border: '1px solid rgba(139, 92, 246, 0.3)', 
                          padding: '2px 8px', 
                          borderRadius: '8px', 
                          fontFamily: 'monospace',
                          letterSpacing: '0.05em'
                        }}>
                          {p.barcode && !p.barcode.startsWith('prod-') ? p.barcode : p.id}
                        </span>
                      </div>
                      <h4 style={{ fontSize: '0.98rem', fontWeight: 700, marginBottom: '12px' }}>{p.name}</h4>
                    </div>
                    <div>
                      <div style={{ fontSize: '1.25rem', fontWeight: 800, color: '#fff', marginBottom: '12px' }}>{formatPrice(p.sellPrice)}</div>
                      <button className="btn btn-primary btn-sm" style={{ width: '100%' }} onClick={() => addToCart(p)} disabled={isOutOfStock}>
                        <Plus size={16} /> Agregar al Carrito
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div>
            <div className="glass-card" style={{ padding: '24px', position: 'sticky', top: '90px' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '18px', paddingBottom: '12px', borderBottom: 'var(--glass-border)' }}>
                <h3 style={{ fontSize: '1.2rem', display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <ShoppingBag size={20} style={{ color: 'var(--color-primary)' }} /> Carrito ({cart.reduce((a, b) => a + b.quantity, 0)})
                </h3>
                {cart.length > 0 && <button className="btn btn-secondary btn-sm" onClick={clearAllCart} style={{ color: '#ef4444' }}><Trash2 size={14} /> Vaciar</button>}
              </div>

              {errorMsg && <div style={{ background: 'rgba(239,68,68,0.15)', color: '#f87171', padding: '10px', borderRadius: '8px', fontSize: '0.82rem', marginBottom: '14px' }}>{errorMsg}</div>}

              <div style={{ maxHeight: '260px', overflowY: 'auto', marginBottom: '20px' }}>
                {cart.length === 0 ? (
                  <p style={{ color: 'var(--text-dim)', textAlign: 'center', padding: '30px 0', fontSize: '0.9rem' }}>🛒 Carrito vacío.<br/>Haz clic en <strong>"+ Agregar al Carrito"</strong> en los productos.</p>
                ) : (
                  cart.map(item => (
                    <div key={item.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid rgba(255,255,255,0.08)' }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: '0.88rem', fontWeight: 700 }}>{item.name}</div>
                        <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>{formatPrice(item.sellPrice)} c/u × {item.quantity} = <strong style={{ color: '#fff' }}>{formatPrice(item.sellPrice * item.quantity)}</strong></div>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                        <button className="btn btn-secondary btn-icon" onClick={() => updateCartQty(item.id, -1)} style={{ padding: '4px 8px' }}><Minus size={13} /></button>
                        <span style={{ fontWeight: 800, width: '22px', textAlign: 'center' }}>{item.quantity}</span>
                        <button className="btn btn-secondary btn-icon" onClick={() => updateCartQty(item.id, 1)} style={{ padding: '4px 8px' }}><Plus size={13} /></button>
                        <button className="btn btn-secondary btn-icon" onClick={() => removeItemFromCart(item.id)} style={{ padding: '6px', color: '#ef4444', marginLeft: '4px' }}><Trash2 size={14} /></button>
                      </div>
                    </div>
                  ))
                )}
              </div>

              <div style={{ marginBottom: '20px' }}>
                <label className="form-label">Forma de Pago</label>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                  <button className={`btn btn-sm ${paymentMethod === 'Efectivo' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setPaymentMethod('Efectivo')}><DollarSign size={14} /> Efectivo</button>
                  <button className={`btn btn-sm ${paymentMethod === 'Transferencia' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setPaymentMethod('Transferencia')}><Smartphone size={14} /> Transferencia</button>
                  <button className={`btn btn-sm ${paymentMethod === 'Tarjeta' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setPaymentMethod('Tarjeta')}><CreditCard size={14} /> Tarjeta</button>
                  <button className={`btn btn-sm ${paymentMethod === 'Cuenta Corriente' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setPaymentMethod('Cuenta Corriente')}><FileText size={14} /> Cta. Corriente</button>
                </div>
              </div>

              {paymentMethod === 'Cuenta Corriente' && (
                <div style={{ background: 'rgba(236, 72, 153, 0.08)', border: '1px solid rgba(236, 72, 153, 0.3)', borderRadius: '12px', padding: '16px', marginBottom: '20px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '10px' }}>
                    <span style={{ fontSize: '0.82rem', fontWeight: 700, color: '#f472b6' }}>CLIENTE CUENTA CORRIENTE</span>
                    <button className="btn btn-primary btn-sm" onClick={() => setShowNewCustModal(true)} style={{ fontSize: '0.75rem', padding: '5px 10px' }}><UserPlus size={13} /> + Nuevo Cliente</button>
                  </div>

                  <select className="form-control" value={selectedCustomerId} onChange={e => setSelectedCustomerId(e.target.value)} style={{ fontSize: '0.88rem', marginBottom: selectedCustomerObj ? '12px' : '0' }}>
                    <option value="">-- Seleccionar Cliente Registrado --</option>
                    {customers.filter(c => c.id !== 'cust-ocasional').map(c => (
                      <option key={c.id} value={c.id}>{c.name} (DNI: {c.dni})</option>
                    ))}
                  </select>

                  {selectedCustomerObj && (
                    <div style={{ background: 'rgba(15, 23, 42, 0.7)', border: '1px solid rgba(236, 72, 153, 0.25)', borderRadius: '10px', padding: '12px' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                        <div><strong style={{ color: '#fff' }}>{selectedCustomerObj.name}</strong><div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>DNI: {selectedCustomerObj.dni||'-'}</div></div>
                        <div style={{ display: 'flex', gap: '6px' }}>
                          <button className="btn btn-secondary btn-sm" onClick={openEditCustomerModal} style={{ padding: '4px 8px' }}><Edit2 size={13} /> Modificar</button>
                          <button className="btn btn-secondary btn-sm" onClick={handleDeleteSelectedCustomer} style={{ padding: '4px 8px', color: '#ef4444' }}><Trash2 size={13} /> Eliminar</button>
                        </div>
                      </div>
                      <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>📍 {selectedCustomerObj.address||'-'} | 📞 {selectedCustomerObj.phone||'-'}</div>
                    </div>
                  )}

                  <div style={{ marginTop: '12px', paddingTop: '10px', borderTop: '1px dotted rgba(236,72,153,0.3)', fontSize: '0.82rem' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', color: '#fbbf24', fontWeight: 700 }}><span>Recargo 10% Cta. Cte. (30 días):</span><span>+ {formatPrice(interestAmount)}</span></div>
                  </div>
                </div>
              )}

              <div style={{ borderTop: 'var(--glass-border)', paddingTop: '16px', marginBottom: '20px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px', color: 'var(--text-muted)' }}><span>Subtotal:</span><span>{formatPrice(subtotal)}</span></div>
                {paymentMethod === 'Cuenta Corriente' && (
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: '#fbbf24', marginBottom: '8px' }}><span>Interés Cta Cte (+10%):</span><span>+ {formatPrice(interestAmount)}</span></div>
                )}
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '1.4rem', fontWeight: 800, color: '#fff' }}>
                  <span>Total a Cobrar:</span><span style={{ color: 'var(--color-primary)' }}>{formatPrice(total)}</span>
                </div>
              </div>

              <button className={`btn ${cashSession?.status === 'open' ? 'btn-success' : 'btn-secondary'}`} style={{ width: '100%', padding: '14px', fontSize: '1.05rem' }} onClick={handleCheckout} disabled={cart.length === 0 || cashSession?.status !== 'open'}>
                <CheckCircle size={20} /> {cashSession?.status !== 'open' ? '🔒 Caja Cerrada' : 'Confirmar Venta y Cobrar'}
              </button>
            </div>
          </div>

          {showNewCustModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <div className="modal-header"><h3>Registrar Cliente en Cta. Cte.</h3><button className="btn btn-secondary btn-sm" onClick={() => setShowNewCustModal(false)}>✕</button></div>

      const { user, logout, isAdmin } = useAuth();
      const { lowStockProducts, overdueCustomers, cashSession } = useData();
      const [theme, setTheme] = useState(() => localStorage.getItem('tina_theme') || 'dark');
      const [timeStr, setTimeStr] = useState('');

      useEffect(() => {
        const updateTime = () => {
          const now = new Date();
          setTimeStr(now.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        };
        updateTime();
        const interval = setInterval(updateTime, 1000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'F2') { e.preventDefault(); setActiveTab('pos'); }
          else if (e.key === 'F3') { e.preventDefault(); setActiveTab('accounts'); }
          else if (e.key === 'F4') { e.preventDefault(); setActiveTab('cash'); }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [setActiveTab]);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('tina_theme', theme);

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      return (
        <header className="glass-card" style={{ borderRadius: 0, borderLeft: 'none', borderRight: 'none', borderTop: 'none', position: 'sticky', top: 0, zIndex: 50, padding: '12px 24px' }}>

              <div style={{ position: 'relative' }}>
                <img src="./public/logo.jpg" alt="Logo" style={{ width: '50px', height: '50px', borderRadius: '14px', objectFit: 'cover', border: '2px solid var(--color-primary)', boxShadow: '0 0 16px rgba(236,72,153,0.5)' }} />
                <span className="live-pulse-dot" style={{ position: 'absolute', bottom: '-2px', right: '-2px' }}></span>
              </div>
              <div>
                <h1 style={{ fontSize: '1.3rem', fontWeight: 900, background: 'linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                  REGALERÍA TINA
                </h1>
                <div style={{ display: 'flex', alignItems: 'center', gap: '6px', fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                  <span>Enterprise System</span> • <span style={{ color: 'var(--color-accent)', fontWeight: 800 }}>{timeStr}</span>
                </div>
              </div>
            </div>

            <nav style={{ display: 'flex', alignItems: 'center', gap: '6px', overflowX: 'auto', padding: '6px 8px', background: 'rgba(15,23,42,0.35)', borderRadius: 'var(--radius-full)', border: 'var(--glass-border)' }}>
              <button className={`btn ${activeTab === 'pos' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setActiveTab('pos')} style={{ borderRadius: 'var(--radius-full)' }}>
                <ShoppingBag /> Sector Ventas <span className="shortcut-badge">F2</span>
              </button>
              <button className={`btn ${activeTab === 'accounts' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setActiveTab('accounts')} style={{ borderRadius: 'var(--radius-full)' }}>
                <Clock /> Cuentas Corrientes <span className="shortcut-badge">F3</span>
                {(overdueCustomers || []).length > 0 && <span className="badge badge-danger" style={{ marginLeft: '4px' }}>{(overdueCustomers || []).length}</span>}
              </button>
              <button className={`btn ${activeTab === 'inventory' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setActiveTab('inventory')} style={{ borderRadius: 'var(--radius-full)' }}>
                <Package /> Inventario
                {(lowStockProducts || []).length > 0 && <span className="badge badge-warning" style={{ marginLeft: '4px' }}>{(lowStockProducts || []).length}</span>}
              </button>
              <button className={`btn ${activeTab === 'cash' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setActiveTab('cash')} style={{ borderRadius: 'var(--radius-full)' }}>
                <Wallet /> Caja Diaria <span className="shortcut-badge">F4</span>
                <span className={`badge ${isCashOpen ? 'badge-success' : 'badge-danger'}`} style={{ marginLeft: '4px' }}>{isCashOpen ? 'Abierta' : 'Cerrada'}</span>
              </button>
            </nav>

            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
              <button type="button" className="btn btn-secondary" onClick={toggleTheme} style={{ color: theme === 'dark' ? '#fbbf24' : '#8b5cf6' }}>
                {theme === 'dark' ? <Sun /> : <Moon />} {theme === 'dark' ? 'Claro' : 'Oscuro'}
              </button>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontSize: '0.88rem', fontWeight: 700 }}>{user?.full_name || 'Usuario'}</div>
                <span className={`badge ${isAdmin ? 'badge-primary' : 'badge-warning'}`}>{isAdmin ? 'Admin' : 'Cajero'}</span>
              </div>
              <button type="button" className="btn btn-primary" onClick={() => setActiveTab('users')} style={{ fontWeight: 800 }}>
                <ShieldCheck /> Administrador
              </button>
              <button type="button" className="btn btn-secondary" onClick={logout} style={{ color: '#ef4444', borderColor: 'rgba(239,68,68,0.4)' }}>
                <LogOut /> Cerrar Sesión
              </button>
            </div>
          </div>
        </header>
      );
    }
