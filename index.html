    function Accounts() {
      const { customers, sales = [], payments = [], overdueCustomers, addPayment, addCustomer, updateCustomer, deleteCustomer } = useData();
      const [search, setSearch] = useState('');
      const [showCustModal, setShowCustModal] = useState(false);
      const [editingCust, setEditingCust] = useState(null);
      const [custForm, setCustForm] = useState({ name: '', dni: '', address: '', phone: '' });
      const [paymentCust, setPaymentCust] = useState(null);
      const [payAmount, setPayAmount] = useState('');
      const [payMethod, setPayMethod] = useState('Efectivo');
      const [detailCust, setDetailCust] = useState(null);
      const [timeFilter, setTimeFilter] = useState('all');
      const [printSheetCust, setPrintSheetCust] = useState(null);

      const activeCustomers = useMemo(() => customers.filter(c => c.id !== 'cust-ocasional'), [customers]);
      const filteredCustomers = useMemo(() => activeCustomers.filter(c => c.name.toLowerCase().includes(search.toLowerCase()) || (c.dni && c.dni.includes(search))), [activeCustomers, search]);
      const totalDebt = useMemo(() => activeCustomers.reduce((acc, c) => acc + (c.balance || 0), 0), [activeCustomers]);
      const formatPrice = (v) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(v || 0);

      const formatDateTime = (v) => {
        if (!v) return '-';
        try {
          const d = new Date(v);
          if (isNaN(d.getTime())) return '-';
          return `${d.toLocaleDateString('es-AR')} - ${d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })} hs`;
        } catch { return '-'; }
      };

      const isDateInFilter = (dateVal, filter) => {
        if (filter === 'all' || !dateVal) return true;
        const d = new Date(dateVal).getTime();
        if (isNaN(d)) return false;
        const now = Date.now();
        const dayMs = 24 * 60 * 60 * 1000;
        if (filter === 'today') {
          const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
          return d >= todayStart.getTime();
        } else if (filter === 'week') { return d >= (now - 7 * dayMs); }
        else if (filter === 'month') { return d >= (now - 30 * dayMs); }
        return true;
      };

      const openCustomerModal = (cust = null) => {
        if (cust) { setEditingCust(cust); setCustForm({ name: cust.name, dni: cust.dni || '', address: cust.address || '', phone: cust.phone || '' }); }
        else { setEditingCust(null); setCustForm({ name: '', dni: '', address: '', phone: '' }); }
        setShowCustModal(true);
      };

      const handleSaveCustomer = (e) => {
        e.preventDefault(); if (!custForm.name.trim()) return;
        if (editingCust) updateCustomer(editingCust.id, custForm);
        else addCustomer(custForm);
        setShowCustModal(false);
      };

      const handleRegisterPayment = (e) => {
        e.preventDefault(); if (!paymentCust || !payAmount) return;
        addPayment(paymentCust.id, payAmount, payMethod, '');
        setPaymentCust(null); setPayAmount('');
      };

      const filteredSalesForDetail = useMemo(() => {
        if (!detailCust) return [];
        return sales.filter(s => s.customerId === detailCust.id && s.paymentMethod === 'Cuenta Corriente' && isDateInFilter(s.created_at, timeFilter));
      }, [sales, detailCust, timeFilter]);

      const filteredPaymentsForDetail = useMemo(() => {
        if (!detailCust) return [];
        return payments.filter(p => p.customerId === detailCust.id && isDateInFilter(p.created_at, timeFilter));
      }, [payments, detailCust, timeFilter]);

      return (
        <div style={{ maxWidth: '1400px', margin: '24px auto', padding: '0 20px' }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '20px', marginBottom: '24px' }}>
            <div className="glass-card" style={{ padding: '20px', display: 'flex', alignItems: 'center', gap: '16px' }}>
              <div style={{ background: 'rgba(236,72,153,0.15)', color: '#ec4899', padding: '14px', borderRadius: '14px' }}><Users size={28} /></div>
              <div><div style={{ fontSize: '0.85rem', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Total Clientes</div><div style={{ fontSize: '1.8rem', fontWeight: 800 }}>{activeCustomers.length}</div></div>
            </div>
            <div className="glass-card" style={{ padding: '20px', display: 'flex', alignItems: 'center', gap: '16px' }}>
              <div style={{ background: 'rgba(139,92,246,0.15)', color: '#8b5cf6', padding: '14px', borderRadius: '14px' }}><DollarSign size={28} /></div>
              <div><div style={{ fontSize: '0.85rem', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Total Deuda Cta. Cte.</div><div style={{ fontSize: '1.8rem', fontWeight: 800, color: '#ec4899' }}>{formatPrice(totalDebt)}</div></div>
            </div>
            <div className="glass-card" style={{ padding: '20px', display: 'flex', alignItems: 'center', gap: '16px' }}>
              <div style={{ background: overdueCustomers.length > 0 ? 'rgba(239,68,68,0.15)' : 'rgba(16,185,129,0.15)', color: overdueCustomers.length > 0 ? '#ef4444' : '#10b981', padding: '14px', borderRadius: '14px' }}><AlertTriangle size={28} /></div>
              <div><div style={{ fontSize: '0.85rem', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Deudas +30 Días</div><div style={{ fontSize: '1.8rem', fontWeight: 800, color: overdueCustomers.length > 0 ? '#ef4444' : '#10b981' }}>{overdueCustomers.length}</div></div>
            </div>
          </div>

          <div className="glass-card" style={{ padding: '20px 24px', marginBottom: '24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <input type="text" className="form-control" style={{ maxWidth: '420px' }} placeholder="Buscar por Nombre, DNI, Teléfono..." value={search} onChange={e => setSearch(e.target.value)} />
            <button className="btn btn-primary" onClick={() => openCustomerModal()}><UserPlus size={18} /> Cargar Nuevo Cliente</button>
          </div>

          <div className="table-responsive glass-card">
            <table className="custom-table">
              <thead><tr><th>Cliente</th><th>DNI</th><th>Domicilio</th><th>Teléfono</th><th>Saldo Adeudado</th><th style={{ textAlign: 'center' }}>Estado</th><th style={{ textAlign: 'center' }}>Acciones</th></tr></thead>
              <tbody>
                {filteredCustomers.map(cust => (
                  <tr key={cust.id}>
                    <td><strong>{cust.name}</strong></td>
                    <td>{cust.dni||'-'}</td>
                    <td>{cust.address||'-'}</td>
                    <td>{cust.phone||'-'}</td>
                    <td style={{ fontWeight: 800, color: cust.balance > 0 ? '#ec4899' : '#10b981' }}>{formatPrice(cust.balance||0)}</td>
                    <td style={{ textAlign: 'center' }}><span className={`badge ${cust.balance > 0 ? 'badge-warning' : 'badge-success'}`}>{cust.balance > 0 ? 'Pendiente' : 'Al Día'}</span></td>
                    <td style={{ textAlign: 'center' }}>
                      <div style={{ display: 'flex', justifyContent: 'center', gap: '6px' }}>
                        <button className="btn btn-success btn-sm" disabled={cust.balance <= 0} onClick={() => { setPaymentCust(cust); setPayAmount(cust.balance); }}><DollarSign size={15} /> Cobrar</button>
                        <button className="btn btn-secondary btn-sm" onClick={() => { setDetailCust(cust); setTimeFilter('all'); }}><Eye size={15} /> Historial</button>
                        <button className="btn btn-secondary btn-sm" onClick={() => setPrintSheetCust(cust)}><Printer size={15} /> Ficha</button>
                        <button className="btn btn-secondary btn-sm" onClick={() => openCustomerModal(cust)}><Edit2 size={15} /></button>
                        <button className="btn btn-secondary btn-sm" style={{ color: '#ef4444' }} onClick={() => deleteCustomer(cust.id)}><Trash2 size={15} /></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {showCustModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <div className="modal-header"><h3>{editingCust ? 'Editar Cliente' : 'Nuevo Cliente'}</h3><button className="btn btn-secondary btn-sm" onClick={() => setShowCustModal(false)}>✕</button></div>
                <form onSubmit={handleSaveCustomer}>
                  <div className="modal-body">
                    <div className="form-group"><label className="form-label">Nombre *</label><input type="text" className="form-control" required value={custForm.name} onChange={e => setCustForm({ ...custForm, name: e.target.value })} /></div>
                    <div className="form-group"><label className="form-label">DNI *</label><input type="text" className="form-control" required value={custForm.dni} onChange={e => setCustForm({ ...custForm, dni: e.target.value })} /></div>
                    <div className="form-group"><label className="form-label">Domicilio *</label><input type="text" className="form-control" required value={custForm.address} onChange={e => setCustForm({ ...custForm, address: e.target.value })} /></div>
                    <div className="form-group"><label className="form-label">Teléfono *</label><input type="tel" className="form-control" required value={custForm.phone} onChange={e => setCustForm({ ...custForm, phone: e.target.value })} /></div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-secondary" onClick={() => setShowCustModal(false)}>Cancelar</button>
                    <button type="submit" className="btn btn-primary">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {paymentCust && (
            <div className="modal-overlay">
              <div className="modal-content" style={{ maxWidth: '480px' }}>
                <div className="modal-header"><h3>Abonar / Entregar Dinero</h3><button className="btn btn-secondary btn-sm" onClick={() => setPaymentCust(null)}>✕</button></div>
                <form onSubmit={handleRegisterPayment}>
                  <div className="modal-body">
                    <p>Cliente: <strong>{paymentCust.name}</strong></p>
                    <p style={{ marginBottom: '14px' }}>Saldo: <strong style={{ color: '#ec4899' }}>{formatPrice(paymentCust.balance)}</strong></p>
                    <div className="form-group"><label className="form-label">Monto ($) *</label><input type="number" step="any" className="form-control" required value={payAmount} onChange={e => setPayAmount(e.target.value)} /></div>
                    <div className="form-group"><label className="form-label">Medio de Pago</label><select className="form-control" value={payMethod} onChange={e => setPayMethod(e.target.value)}><option value="Efectivo">Efectivo</option><option value="Transferencia">Transferencia</option><option value="Tarjeta">Tarjeta</option></select></div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-secondary" onClick={() => setPaymentCust(null)}>Cancelar</button>
                    <button type="submit" className="btn btn-success">Confirmar Abono</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {detailCust && (
            <div className="modal-overlay">
              <div className="modal-content" style={{ maxWidth: '820px' }}>
                <div className="modal-header">
                  <h3>Historial Detallado: {detailCust.name}</h3>
                  <button className="btn btn-secondary btn-sm" onClick={() => setDetailCust(null)}>✕</button>
                </div>
                <div className="modal-body">
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px', background: 'var(--bg-primary)', padding: '14px', borderRadius: '10px' }}>
                    <div>DNI: {detailCust.dni||'-'} | Tel: {detailCust.phone||'-'}</div>
                    <div>Saldo: <strong style={{ color: '#ec4899', fontSize: '1.2rem' }}>{formatPrice(detailCust.balance)}</strong></div>
                  </div>

                  <div style={{ display: 'flex', gap: '6px', marginBottom: '16px', flexWrap: 'wrap' }}>
                    <button className={`btn btn-sm ${timeFilter === 'today' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setTimeFilter('today')}>📅 Hoy</button>
                    <button className={`btn btn-sm ${timeFilter === 'week' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setTimeFilter('week')}>🗓️ Esta Semana</button>
                    <button className={`btn btn-sm ${timeFilter === 'month' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setTimeFilter('month')}>📆 Este Mes</button>
                    <button className={`btn btn-sm ${timeFilter === 'all' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setTimeFilter('all')}>📜 Todos</button>
                  </div>

                  <h4 style={{ color: '#ec4899', marginBottom: '8px' }}>🛒 Compras a Crédito (Fecha y Hora Exacta)</h4>
                  <div className="table-responsive" style={{ marginBottom: '16px' }}>
                    <table className="custom-table">
                      <thead><tr><th>Fecha & Hora</th><th>Ticket #</th><th>Detalle Artículos</th><th>Total</th></tr></thead>
                      <tbody>
                        {filteredSalesForDetail.length === 0 ? (
                          <tr><td colSpan="4" style={{ textAlign: 'center', padding: '16px', color: 'var(--text-muted)' }}>Sin compras en este período.</td></tr>
                        ) : (
                          filteredSalesForDetail.map(s => (
                            <tr key={s.id}>
                              <td style={{ fontSize: '0.85rem', color: '#06b6d4', fontWeight: 700 }}>{formatDateTime(s.created_at)}</td>
                              <td>#{s.id}</td>
                              <td>{s.items ? s.items.map(i => `${i.quantity}x ${i.name}`).join(', ') : '-'}</td>
                              <td style={{ fontWeight: 800 }}>{formatPrice(s.total)}</td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>

                  <h4 style={{ color: '#10b981', marginBottom: '8px' }}>💵 Entregas / Abonos</h4>
                  <div className="table-responsive">
                    <table className="custom-table">
                      <thead><tr><th>Fecha & Hora</th><th>Medio</th><th>Monto</th></tr></thead>
                      <tbody>
                        {filteredPaymentsForDetail.length === 0 ? (
                          <tr><td colSpan="3" style={{ textAlign: 'center', padding: '16px', color: 'var(--text-muted)' }}>Sin abonos en este período.</td></tr>
                        ) : (
                          filteredPaymentsForDetail.map(p => (
                            <tr key={p.id}>
                              <td style={{ fontSize: '0.85rem', color: '#10b981', fontWeight: 700 }}>{formatDateTime(p.created_at)}</td>
                              <td>{p.paymentMethod}</td>
                              <td style={{ fontWeight: 800, color: '#10b981' }}>{formatPrice(p.amount)}</td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>

                </div>
                <div className="modal-footer">
                  <button className="btn btn-secondary" onClick={() => setPrintSheetCust(detailCust)}><Printer size={16} /> Imprimir Ficha</button>
                  <button className="btn btn-primary" onClick={() => setDetailCust(null)}>Cerrar</button>
                </div>
              </div>
            </div>
          )}

          {printSheetCust && (
            <div className="modal-overlay">
              <div className="modal-content" style={{ maxWidth: '650px' }}>
                <div className="modal-header"><h3>Ficha Resumen de Cuenta Corriente</h3><button className="btn btn-secondary btn-sm" onClick={() => setPrintSheetCust(null)}>✕</button></div>
                <div className="modal-body">
                  <div className="receipt-box">
                    <div style={{ textAlign: 'center', borderBottom: '2px solid #0f172a', paddingBottom: '10px', marginBottom: '14px' }}>
                      <h2 style={{ fontSize: '1.3rem', fontWeight: 900, color: '#0f172a' }}>REGALERÍA TINA</h2>
                      <p style={{ fontSize: '0.8rem', color: '#475569' }}>ESTADO DE CUENTA CORRIENTE CLIENTE</p>
                      <p style={{ fontSize: '0.75rem', color: '#64748b' }}>Fecha: {new Date().toLocaleString()}</p>
                    </div>
                    <p><strong>Cliente:</strong> {printSheetCust.name} | <strong>DNI:</strong> {printSheetCust.dni||'-'}</p>
                    <p><strong>Domicilio:</strong> {printSheetCust.address||'-'} | <strong>Tel:</strong> {printSheetCust.phone||'-'}</p>
                    <p style={{ marginTop: '10px', fontSize: '1.2rem', fontWeight: 900 }}>Saldo Deudor: {formatPrice(printSheetCust.balance)}</p>
                  </div>
                </div>
                <div className="modal-footer" style={{ justifyContent: 'center' }}>
                  <button className="btn btn-primary" onClick={() => window.print()}><Printer size={16} /> Imprimir / PDF</button>
                  <button className="btn btn-secondary" onClick={() => setPrintSheetCust(null)}>Cerrar</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    function Inventory() {
      const { products, categories, addCategory, brands = [], addBrand, deleteBrand, addProduct, updateProduct, deleteProduct, adjustProductStock } = useData();
      const [search, setSearch] = useState('');
      const [selectedBrand, setSelectedBrand] = useState('ALL');
      const [showModal, setShowModal] = useState(false);
      const [showBrandManagerModal, setShowBrandManagerModal] = useState(false);
      const [newBrandInput, setNewBrandInput] = useState('');
      const [labelProduct, setLabelProduct] = useState(null);
      const [editingProd, setEditingProd] = useState(null);
      const [form, setForm] = useState({ 
        name: '', 
        brand: '', 
        brandMode: 'SELECT',
        customBrand: '',
        category: '', 
        categoryMode: 'SELECT',
        customCategory: '',
        barcode: '',
        variantCode: '01',
        costPrice: '', 
        sellPrice: '', 
        stock: '1', 
        minStock: '3' 
      });
      const formatPrice = (v) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(v);

      const duplicateProd = useMemo(() => {
        const codeToTest = (form.barcode || '').trim().toUpperCase();
        if (!codeToTest) return null;
        return products.find(p => 
          p.barcode && 
          p.barcode.trim().toUpperCase() === codeToTest && 
          (!editingProd || p.id !== editingProd.id)
        );
      }, [form.barcode, products, editingProd]);

      const suggestedAlternativeCode = useMemo(() => {
        if (!duplicateProd) return '';
        const currentCat = form.categoryMode === 'CUSTOM' ? form.customCategory : form.category;
        return generateAutoCode(currentCat, products, form.name, form.variantCode, editingProd ? editingProd.id : null);
      }, [duplicateProd, form.category, form.categoryMode, form.customCategory, form.name, form.variantCode, products, editingProd]);

      const openModal = (p = null) => {
        if (p) { 
          setEditingProd(p); 
          let variant = '01';
          if (p.barcode && p.barcode.includes('-')) {
            const parts = p.barcode.split('-');
            if (parts.length >= 3) variant = parts[1];
          }
          setForm({ 
            name: p.name, 
            brand: p.brand || '', 
            brandMode: 'SELECT',
            customBrand: '',
            category: p.category || '', 
            categoryMode: 'SELECT',
            customCategory: '',
            barcode: p.barcode || '', 
            variantCode: variant,
            costPrice: p.costPrice !== undefined ? String(p.costPrice) : '', 
            sellPrice: p.sellPrice !== undefined ? String(p.sellPrice) : '', 
            stock: p.stock !== undefined ? String(p.stock) : '1', 
            minStock: p.minStock !== undefined ? String(p.minStock) : '3' 
          }); 
        } else { 
          setEditingProd(null); 
          const defaultCat = categories.length > 0 ? categories[0] : 'Bijouterie';
          const autoCode = generateAutoCode(defaultCat, products, '', '01');
          setForm({ 
            name: '', 
            brand: '', 
            brandMode: 'SELECT',
            customBrand: '',
            category: defaultCat, 
            categoryMode: 'SELECT',
            customCategory: '',
            barcode: autoCode, 
            variantCode: '01',
            costPrice: '', 
            sellPrice: '', 
            stock: '1', 
            minStock: '3' 
          }); 
        }
        setShowModal(true);
      };

      const handleSubmit = (e) => {
        e.preventDefault(); 
        if (!form.name.trim()) {
          alert('Por favor ingrese el Nombre Comercial del producto.');
          return;
        }
        if (!form.sellPrice || isNaN(parseFloat(form.sellPrice))) {
          alert('Por favor ingrese un Precio de Venta válido.');
          return;
        }

        // Marca final
        let finalBrand = form.brandMode === 'CUSTOM' ? form.customBrand.trim() : form.brand.trim();
        if (!finalBrand) finalBrand = 'Sin Marca';

        if (finalBrand !== 'Sin Marca' && !brands.includes(finalBrand) && addBrand) {
          addBrand(finalBrand);
        }

        // Categoría / Rubro final
        let finalCategory = form.categoryMode === 'CUSTOM' ? form.customCategory.trim() : form.category.trim();
        if (!finalCategory) finalCategory = 'General';

        if (finalCategory !== 'General' && !categories.includes(finalCategory) && addCategory) {
          addCategory(finalCategory);
        }

        let finalBarcode = form.barcode.trim().toUpperCase();
        if (!finalBarcode) {
          finalBarcode = generateAutoCode(finalCategory, products, form.name.trim(), form.variantCode, editingProd ? editingProd.id : null);
        }

        const existingDuplicate = products.find(p => 
          p.barcode && 
          p.barcode.trim().toUpperCase() === finalBarcode && 
          (!editingProd || p.id !== editingProd.id)
        );

        if (existingDuplicate) {
          const alt = generateAutoCode(finalCategory, products, form.name.trim(), form.variantCode, editingProd ? editingProd.id : null);
          alert(`⚠️ El código "${finalBarcode}" ya está registrado para el producto "${existingDuplicate.name}".\n\nSe asignó automáticamente el código sugerido disponible: "${alt}".`);
          finalBarcode = alt;
          setForm(f => ({ ...f, barcode: alt }));
        }

        const payload = { 
          name: form.name.trim(),
          brand: finalBrand, 
          category: finalCategory,
          barcode: finalBarcode,
          costPrice: form.costPrice !== '' ? parseFloat(form.costPrice) : 0,
          sellPrice: parseFloat(form.sellPrice),
          stock: form.stock !== '' && !isNaN(parseInt(form.stock)) ? parseInt(form.stock) : 1,
          minStock: form.minStock !== '' && !isNaN(parseInt(form.minStock)) ? parseInt(form.minStock) : 3
        };

        if (editingProd) updateProduct(editingProd.id, payload);
        else addProduct(payload);
        setShowModal(false);
      };

      const filteredProducts = useMemo(() => {
        const term = search.trim().toLowerCase();
        if (!term) return products.filter(p => selectedBrand === 'ALL' || (p.brand || 'Sin Marca') === selectedBrand);
        const cleanTerm = term.replace(/[^a-z0-9]/g, '');

        return products.filter(p => {
          const codeLower = (p.barcode || '').toLowerCase();
          const cleanCode = codeLower.replace(/[^a-z0-9]/g, '');

          const matchCode = codeLower.includes(term) || (cleanCode && cleanCode.includes(cleanTerm));
          const matchName = p.name.toLowerCase().includes(term);
          const matchCategory = p.category.toLowerCase().includes(term);
          const matchBrand = p.brand && p.brand.toLowerCase().includes(term);

          const matchSearch = matchCode || matchName || matchCategory || matchBrand;
          const matchBrandSel = selectedBrand === 'ALL' || (p.brand || 'Sin Marca') === selectedBrand;
          return matchSearch && matchBrandSel;
        });
      }, [products, search, selectedBrand]);

      return (
        <div style={{ maxWidth: '1400px', margin: '24px auto', padding: '0 20px' }}>
          <div className="glass-card" style={{ padding: '20px 24px', marginBottom: '24px', display: 'flex', gap: '14px', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ display: 'flex', gap: '12px', flex: 1, minWidth: '300px' }}>
              <input type="text" className="form-control" style={{ flex: 1 }} placeholder="Buscar por nombre, marca, código de producto o categoría..." value={search} onChange={e => setSearch(e.target.value)} />
              <select className="form-control" value={selectedBrand} onChange={e => setSelectedBrand(e.target.value)} style={{ width: 'auto', fontWeight: 800 }}>
                <option value="ALL">🏷️ Todas las Marcas</option>
                {brands.map(b => <option key={b} value={b}>{b}</option>)}
              </select>
            </div>
            <div style={{ display: 'flex', gap: '10px' }}>
              <button className="btn btn-secondary" onClick={() => setShowBrandManagerModal(true)} style={{ borderRadius: 'var(--radius-full)', fontWeight: 800 }}>⚙️ Gestionar Marcas</button>
              <button className="btn btn-primary" onClick={() => openModal()} style={{ borderRadius: 'var(--radius-full)', fontWeight: 900 }}>+ Nuevo Producto</button>
            </div>
          </div>

          <div className="table-responsive glass-card">
            <table className="custom-table">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th>Marca</th>
                  <th>Categoría</th>
                  <th>Código de Producto</th>
                  <th>Costo</th>
                  <th>Precio Venta</th>
                  <th>Stock</th>
                  <th style={{ textAlign: 'right' }}>Acciones</th>
                </tr>
              </thead>
              <tbody>
                {filteredProducts.length === 0 ? (
                  <tr><td colSpan="8" style={{ textAlign: 'center', padding: '30px', color: 'var(--text-muted)' }}>No se encontraron productos.</td></tr>
                ) : (
                  filteredProducts.map(p => (
                    <tr key={p.id}>
                      <td style={{ fontWeight: 800, color: '#fff' }}>{p.name}</td>
                      <td><span style={{ background: 'rgba(236, 72, 153, 0.15)', color: '#ec4899', padding: '3px 10px', borderRadius: 'var(--radius-full)', fontSize: '0.8rem', fontWeight: 800 }}>🏷️ {p.brand || 'Sin Marca'}</span></td>
                      <td style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>{p.category}</td>
                      <td>
                        <span style={{ 
                          background: 'rgba(139, 92, 246, 0.15)', 
                          color: '#c4b5fd', 
                          padding: '4px 10px', 
                          borderRadius: '8px', 
                          fontSize: '0.85rem', 
                          fontFamily: 'monospace', 
                          fontWeight: 900,
                          border: '1px solid rgba(139, 92, 246, 0.3)',
                          letterSpacing: '0.05em'
                        }}>
                          {p.barcode && !p.barcode.startsWith('prod-') ? p.barcode : generateAutoCode(p.category, products, p.name)}
                        </span>
                      </td>
                      <td>{formatPrice(p.costPrice || 0)}</td>
                      <td style={{ fontWeight: 900, color: 'var(--color-primary)' }}>{formatPrice(p.sellPrice || 0)}</td>
                      <td>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                          <span className={`badge ${p.stock <= 0 ? 'badge-danger' : p.stock <= p.minStock ? 'badge-warning' : 'badge-success'}`} style={{ fontSize: '0.85rem', fontWeight: 900, minWidth: '85px', textAlign: 'center' }}>
                            {p.stock <= 0 ? 'Agotado (0)' : `Stock: ${p.stock}`}
                          </span>
                          <div style={{ display: 'flex', gap: '3px' }}>
                            <button 
                              type="button" 
                              className="btn btn-secondary btn-sm" 
                              onClick={() => adjustProductStock(p.id, -1)}
                              disabled={p.stock <= 0}
                              title="Restar 1 unidad"
                              style={{ padding: '3px 7px', fontSize: '0.78rem', fontWeight: 900, borderRadius: '6px' }}
                            >
                              -1
                            </button>
                            <button 
                              type="button" 
                              className="btn btn-secondary btn-sm" 
                              onClick={() => adjustProductStock(p.id, 1)}
                              title="Sumar 1 unidad"
                              style={{ padding: '3px 7px', fontSize: '0.78rem', fontWeight: 900, borderRadius: '6px', color: '#10b981', borderColor: 'rgba(16, 185, 129, 0.4)', background: 'rgba(16, 185, 129, 0.1)' }}
                            >
                              +1
                            </button>
                            <button 
                              type="button" 
                              className="btn btn-secondary btn-sm" 
                              onClick={() => adjustProductStock(p.id, 5)}
                              title="Sumar 5 unidades"
                              style={{ padding: '3px 7px', fontSize: '0.78rem', fontWeight: 900, borderRadius: '6px', color: '#f59e0b', borderColor: 'rgba(245, 158, 11, 0.4)', background: 'rgba(245, 158, 11, 0.1)' }}
                            >
                              +5
                            </button>
                          </div>
                        </div>
                      </td>
                      <td style={{ textAlign: 'right' }}>
                        <button className="btn btn-secondary btn-sm" onClick={() => openModal(p)} style={{ marginRight: '6px' }}>Editar</button>
                        <button className="btn btn-secondary btn-sm" onClick={() => deleteProduct(p.id)} style={{ color: '#ef4444' }}>Eliminar</button>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>

          {/* MODAL GESTIÓN DE MARCAS */}
          {showBrandManagerModal && (
            <div className="modal-overlay">
              <div className="modal-content" style={{ maxWidth: '520px', borderRadius: '20px' }}>
                <div className="modal-header">
                  <h3 style={{ fontSize: '1.15rem', fontWeight: 900, color: '#fff' }}>🏷️ Gestión de Marcas del Catálogo</h3>
                  <button className="btn btn-secondary btn-sm" onClick={() => setShowBrandManagerModal(false)}>✕</button>
                </div>
                <div className="modal-body" style={{ padding: '20px', display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <form onSubmit={e => {
                    e.preventDefault();
                    if (newBrandInput.trim()) {
                      addBrand(newBrandInput.trim());
                      setNewBrandInput('');
                    }
                  }} style={{ display: 'flex', gap: '10px' }}>
                    <input 
                      type="text" 
                      className="form-control" 
                      placeholder="Escriba nueva marca (ej. Care, Pink 365...)" 
                      value={newBrandInput} 
                      onChange={e => setNewBrandInput(e.target.value)}
                      style={{ fontWeight: 700 }}
                    />
                    <button type="submit" className="btn btn-primary" style={{ whiteSpace: 'nowrap', borderRadius: 'var(--radius-full)' }}>+ Agregar</button>
                  </form>

                  <div>
                    <div style={{ fontSize: '0.8rem', fontWeight: 800, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '12px' }}>
                      Marcas Registradas en el Catálogo ({brands.length})
                    </div>
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '10px', maxHeight: '280px', overflowY: 'auto', padding: '16px', background: 'var(--bg-primary)', borderRadius: '16px', border: 'var(--glass-border)' }}>
                      {brands.map(b => (
                        <div 
                          key={b} 
                          style={{ 
                            display: 'inline-flex', 
                            alignItems: 'center', 
                            gap: '8px', 
                            background: 'rgba(236, 72, 153, 0.14)', 
                            border: '1px solid rgba(236, 72, 153, 0.3)', 
                            color: '#fff', 
                            padding: '6px 14px', 
                            borderRadius: 'var(--radius-full)', 
                            fontSize: '0.88rem', 
                            fontWeight: 800 
                          }}
                        >
                          <span>🏷️ {b}</span>
                          {b !== 'Sin Marca' && (
                            <button 
                              type="button" 
                              onClick={() => {
                                if (window.confirm(`¿Seguro que deseas eliminar la marca "${b}" del catálogo?`)) {
                                  deleteBrand(b);
                                }
                              }} 
                              style={{ 
                                background: 'rgba(239, 68, 68, 0.25)', 
                                border: 'none', 
                                color: '#f87171', 
                                borderRadius: '50%', 
                                width: '22px', 
                                height: '22px', 
                                display: 'flex', 
                                alignItems: 'center', 
                                justifyContent: 'center', 
                                cursor: 'pointer' 
                              }}
                              title="Eliminar esta marca"
                            >
                              ✕
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
                <div className="modal-footer" style={{ padding: '16px 26px' }}>
                  <button type="button" className="btn btn-secondary" onClick={() => setShowBrandManagerModal(false)} style={{ borderRadius: 'var(--radius-full)' }}>Cerrar</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL NUEVO / EDITAR PRODUCTO */}
          {showModal && (
            <div className="modal-overlay" style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.75)', backdropFilter: 'blur(6px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 9999, padding: '16px' }}>
              <div className="modal-content" style={{ maxWidth: '680px', width: '100%', maxHeight: '90vh', borderRadius: '24px', overflow: 'hidden', display: 'flex', flexDirection: 'column', background: 'var(--bg-secondary)', border: '1px solid rgba(255,255,255,0.15)', boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.7)' }}>
                <div className="modal-header" style={{ background: 'linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(139, 92, 246, 0.2))', padding: '18px 24px', flexShrink: 0, display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid rgba(255,255,255,0.1)' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                    <div style={{ width: '40px', height: '40px', borderRadius: '12px', background: 'var(--color-primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff' }}>
                      {editingProd ? <Edit2 size={20} /> : <Package size={20} />}
                    </div>
                    <div>
                      <h3 style={{ fontSize: '1.25rem', fontWeight: 900, color: '#fff', margin: 0 }}>
                        {editingProd ? '✏️ Modificar Producto del Catálogo' : '✨ Agregar Nuevo Producto'}
                      </h3>
                      <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)', margin: 0 }}>
                        {editingProd ? 'Edite los precios, marcas o código del producto.' : 'Complete la información comercial y código para ingresarlo al sistema.'}
                      </p>
                    </div>
                  </div>
                  <button className="btn btn-secondary btn-sm" onClick={() => setShowModal(false)} style={{ borderRadius: '50%', width: '36px', height: '36px', padding: 0 }}>✕</button>
                </div>

                <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', flex: 1, overflow: 'hidden', margin: 0 }}>
                  <div className="modal-body" style={{ padding: '24px', display: 'flex', flexDirection: 'column', gap: '18px', overflowY: 'auto', flex: 1 }}>
                    
                    {/* 1. NOMBRE DEL PRODUCTO */}
                    <div className="form-group" style={{ margin: 0 }}>
                      <label className="form-label" style={{ fontWeight: 800 }}>Nombre Comercial del Producto *</label>
                      <input 
                        type="text" 
                        className="form-control" 
                        required 
                        value={form.name} 
                        onChange={e => {
                          const newName = e.target.value;
                          const currentCat = form.categoryMode === 'CUSTOM' ? form.customCategory : form.category;
                          const autoCode = generateAutoCode(currentCat, products, newName, form.variantCode);
                          setForm({ ...form, name: newName, barcode: autoCode });
                        }} 
                        placeholder="Ej. Cartera Bandolera Eco-Cuero Suave con Cierre" 
                        style={{ fontSize: '1rem', fontWeight: 700 }} 
                      />
                    </div>

                    {/* 2. MARCA DEL PRODUCTO */}
                    <div className="form-group" style={{ margin: 0 }}>
                      <label className="form-label" style={{ color: '#ec4899', fontWeight: 800 }}>🏷️ Marca del Producto</label>

    function CashRegister() {
      const { user, isAdmin } = useAuth();
      const { 
        sales = [], payments = [], expenses = [], expenseCategories = [], addExpense, deleteExpense, 
        cashSession, cashHistory = [], openCash, closeCash, deleteCashHistoryRecord 
      } = useData();

      const [activeTab, setActiveTab] = useState('current');
      const [showOpenModal, setShowOpenModal] = useState(false);
      const [openInput, setOpenInput] = useState('5000');
      const [showCloseModal, setShowCloseModal] = useState(false);
      const [actualCloseInput, setActualCloseInput] = useState('');
      const [showExpenseModal, setShowExpenseModal] = useState(false);
      const [expenseCategory, setExpenseCategory] = useState(expenseCategories[0] || '⚡ Energía Eléctrica (Luz)');
      const [expenseDesc, setExpenseDesc] = useState('');
      const [expenseAmount, setExpenseAmount] = useState('');
      const [expenseMethod, setExpenseMethod] = useState('Efectivo');
      const [expenseError, setExpenseError] = useState('');
      const [selectedAuditHistory, setSelectedAuditHistory] = useState(null);

      const formatPrice = (v) => {
        const num = Number(v);
        if (isNaN(num)) return '$ 0';
        try { return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(num); } catch { return `$ ${num}`; }
      };
      const formatDate = (v) => {
        if (!v) return '-';
        try { const d = new Date(v); return isNaN(d.getTime()) ? '-' : d.toLocaleString(); } catch { return '-'; }
      };
      const formatTime = (v) => {
        if (!v) return '-';
        try { const d = new Date(v); return isNaN(d.getTime()) ? '-' : d.toLocaleTimeString([], { hour: '2-2-digit', minute: '2-2-digit' }); } catch { return '-'; }
      };
      const isSessionOpen = Boolean(cashSession && cashSession.status === 'open');

      const currentSales = useMemo(() => {
        if (!cashSession || !cashSession.openedAt) return [];
        const start = new Date(cashSession.openedAt).getTime();
        const end = cashSession.closedAt ? new Date(cashSession.closedAt).getTime() : Infinity;
        return sales.filter(s => s && s.created_at && new Date(s.created_at).getTime() >= start && new Date(s.created_at).getTime() <= end);
      }, [sales, cashSession]);

      const currentPayments = useMemo(() => {
        if (!cashSession || !cashSession.openedAt) return [];
        const start = new Date(cashSession.openedAt).getTime();
        const end = cashSession.closedAt ? new Date(cashSession.closedAt).getTime() : Infinity;
        return payments.filter(p => p && p.created_at && new Date(p.created_at).getTime() >= start && new Date(p.created_at).getTime() <= end);
      }, [payments, cashSession]);

      const currentExpenses = useMemo(() => {
        if (!cashSession || !cashSession.openedAt) return [];
        const start = new Date(cashSession.openedAt).getTime();
        const end = cashSession.closedAt ? new Date(cashSession.closedAt).getTime() : Infinity;
        return expenses.filter(e => e && e.created_at && new Date(e.created_at).getTime() >= start && new Date(e.created_at).getTime() <= end);
      }, [expenses, cashSession]);

      const totalsByMethod = useMemo(() => {
        const res = { EfectivoVentas: 0, EfectivoCobros: 0, EfectivoTotal: 0, Transferencia: 0, Tarjeta: 0, 'Cuenta Corriente': 0, TotalIngresos: 0 };
        currentSales.forEach(s => {
          if (s?.status === 'completed') {
            const amt = Number(s.total) || 0;
            if (s.paymentMethod === 'Efectivo') res.EfectivoVentas += amt;
            else res[s.paymentMethod] = (res[s.paymentMethod] || 0) + amt;
            res.TotalIngresos += amt;
          }
        });
        currentPayments.forEach(p => {
          if (p) {
            const amt = Number(p.amount) || 0;
            if (p.paymentMethod === 'Efectivo') res.EfectivoCobros += amt;
            else res[p.paymentMethod] = (res[p.paymentMethod] || 0) + amt;
            res.TotalIngresos += amt;
          }
        });
        res.EfectivoTotal = res.EfectivoVentas + res.EfectivoCobros;
        return res;
      }, [currentSales, currentPayments]);

      const totalsExpenses = useMemo(() => {
        const res = { Efectivo: 0, Transferencia: 0, Tarjeta: 0, TotalGastos: 0 };
        currentExpenses.forEach(e => {
          if (e) {
            const amt = Number(e.amount) || 0;
            const m = e.paymentMethod || 'Efectivo';
            res[m] = (res[m] || 0) + amt;
            res.TotalGastos += amt;
          }
        });
        return res;
      }, [currentExpenses]);

      const openAmount = Number(cashSession?.openAmount) || 0;
      const cashInHand = openAmount + totalsByMethod.EfectivoTotal - totalsExpenses.Efectivo;

      const handleOpenCloseModal = () => { setActualCloseInput(cashInHand.toString()); setShowCloseModal(true); };
      const handleOpenSubmit = (e) => { e.preventDefault(); openCash(openInput || 0); setShowOpenModal(false); };
      const handleConfirmClose = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const finalCounted = parseFloat(actualCloseInput);
        const countedCash = isNaN(finalCounted) ? cashInHand : finalCounted;
        const diff = countedCash - cashInHand;
        const audit = {
          openAmount, totalSalesCash: totalsByMethod.EfectivoVentas, totalPaymentsCash: totalsByMethod.EfectivoCobros,
          totalDigital: (totalsByMethod.Transferencia || 0) + (totalsByMethod.Tarjeta || 0), totalCreditAccount: totalsByMethod['Cuenta Corriente'] || 0,
          totalExpensesCash: totalsExpenses.Efectivo, totalExpensesOther: totalsExpenses.TotalGastos - totalsExpenses.Efectivo,
          expectedCash: cashInHand, countedCash, cashDifference: diff, salesCount: currentSales.length, expensesCount: currentExpenses.length
        };
        closeCash(countedCash, audit);
        setShowCloseModal(false);
      };

      const handleAddExpenseSubmit = (e) => {
        e.preventDefault(); setExpenseError('');
        if (!isSessionOpen) return setExpenseError('La caja está CERRADA.');
        if (!expenseDesc.trim() || !expenseAmount || parseFloat(expenseAmount) <= 0) return setExpenseError('Ingrese descripción y monto mayor a 0.');
        try {
          addExpense({ category: expenseCategory, description: expenseDesc, amount: expenseAmount, paymentMethod: expenseMethod });
          setShowExpenseModal(false); setExpenseDesc(''); setExpenseAmount('');
        } catch (err) { setExpenseError(err.message); }
      };

      return (
        <div style={{ maxWidth: '1400px', margin: '24px auto', padding: '0 20px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', flexWrap: 'wrap', gap: '12px' }}>
            <div style={{ display: 'flex', gap: '10px' }}>
              <button className={`btn ${activeTab === 'current' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setActiveTab('current')}><Wallet size={18} /> Jornada Actual</button>
              <button className={`btn ${activeTab === 'history' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setActiveTab('history')}><History size={18} /> Historial de Arqueos ({cashHistory.length})</button>
            </div>

                    <button type="button" className="btn btn-secondary" onClick={() => setShowModal(false)}>Cancelar</button>

                      try { importBackupData(evt.target.result); alert('✅ Copia restaurada con éxito.'); }
                      catch(err) { alert('⚠️ Error: ' + err.message); }
                    };
                    reader.readAsText(file);
                  }
                }} />
              </label>
            </div>
          </div>
        </div>
      );
    }

    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: '40px', textAlign: 'center' }}>
              <h2>⚠️ Hubo un error al renderizar la vista</h2>
              <button className="btn btn-primary" onClick={() => window.location.reload()}>🔄 Recargar Página</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      const { user, loading } = useAuth();
      const [activeTab, setActiveTab] = useState('pos');

      if (loading) return <div style={{ color: '#ec4899', textAlign: 'center', marginTop: '100px' }}><h2>Cargando Regalería Tina...</h2></div>;
      if (!user) return <Login />;

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', position: 'relative' }}>
          <div className="ambient-orb-1"></div>
          <div className="ambient-orb-2"></div>
          <Navbar activeTab={activeTab} setActiveTab={setActiveTab} />
          <main style={{ flex: 1, paddingBottom: '40px' }}>
            <ErrorBoundary key={activeTab}>
              {activeTab === 'pos' && <POS />}
              {activeTab === 'accounts' && <Accounts />}
              {activeTab === 'inventory' && <Inventory />}
              {activeTab === 'cash' && <CashRegister />}
              {activeTab === 'users' && <UsersAdmin />}
            </ErrorBoundary>
          </main>
          <footer style={{ background: 'var(--bg-secondary)', borderTop: 'var(--glass-border)', padding: '16px', textAlign: 'center', fontSize: '0.8rem', color: 'var(--text-muted)' }}>
            Regalería Tina - Sistema Gestor de Ventas, Inventario & Cuentas Corrientes © {new Date().getFullYear()}
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <AuthProvider>
        <DataProvider>
          <App />
        </DataProvider>
      </AuthProvider>
    );
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
